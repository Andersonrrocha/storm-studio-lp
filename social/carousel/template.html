<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#05060a; --surface:#0d1019; --text:#e8eaf2; --dim:#9aa0b4;
    --cobre:#fb923c; --cobre-deep:#b45309; --flash:#fff4e6;
    --line:rgba(140,160,220,.12);
    --fd:'Space Grotesk',system-ui,sans-serif; --fm:'JetBrains Mono',ui-monospace,monospace;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  body{background:#000;font-family:var(--fd);-webkit-font-smoothing:antialiased}
  /* slide em 540x675 (metade de 1080x1350); o export usa device_scale_factor=2 */
  .slide{
    position:relative;width:540px;height:675px;overflow:hidden;
    background:
      radial-gradient(ellipse 90% 60% at 20% 0%, rgba(180,83,9,.28), transparent 60%),
      radial-gradient(ellipse 80% 60% at 90% 100%, rgba(251,146,60,.14), transparent 60%),
      var(--bg);
    color:var(--text);padding:56px 48px;display:flex;flex-direction:column;
  }
  .slide::after{ /* grain */
    content:"";position:absolute;inset:0;pointer-events:none;opacity:.5;
    background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='120' height='120'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='3'/><feColorMatrix type='saturate' values='0'/></filter><rect width='120' height='120' filter='url(%23n)' opacity='.055'/></svg>");
  }
  .bolt{position:absolute;top:-70px;right:-70px;width:260px;opacity:.10;filter:blur(.4px)}
  .slide>*:not(.bolt){position:relative;z-index:1}
  .kicker{font-family:var(--fm);font-size:13px;letter-spacing:.22em;text-transform:uppercase;color:var(--cobre);
    display:flex;align-items:center;gap:10px}
  .kicker::before{content:"";width:26px;height:1px;background:var(--cobre)}
  h1{font-size:54px;line-height:1.02;letter-spacing:-.03em;font-weight:700;margin-top:auto}
  h1 em{font-style:normal;background:linear-gradient(100deg,#fff4e6,#fb923c 45%,#b45309 95%);
    -webkit-background-clip:text;background-clip:text;color:transparent}
  h2{font-size:38px;line-height:1.08;letter-spacing:-.025em;font-weight:600;margin-top:34px}
  p{font-size:19px;line-height:1.55;color:var(--dim);margin-top:20px;max-width:44ch}
  p strong{color:var(--text);font-weight:600}
  .body{margin-top:auto}
  .foot{margin-top:34px;padding-top:18px;border-top:1px solid var(--line);
    display:flex;justify-content:space-between;align-items:center;
    font-family:var(--fm);font-size:12.5px;color:#868ea3;letter-spacing:.04em}
  .idx{color:var(--cobre)}
  .swipe{font-family:var(--fm);font-size:13px;color:var(--cobre);letter-spacing:.1em;margin-top:26px}
  .code{font-family:var(--fm);font-size:15px;line-height:1.75;color:#9aa0b4;background:rgba(13,16,25,.75);
    border:1px solid var(--line);border-left:2px solid var(--cobre);border-radius:8px;padding:18px 20px;margin-top:26px}
  .code strong{color:var(--flash);font-weight:500}
  .cta{margin-top:26px;display:inline-flex;align-self:flex-start;gap:10px;align-items:center;
    background:linear-gradient(100deg,#fb923c,#b45309);color:#0b0704;font-weight:600;font-size:19px;
    padding:14px 24px;border-radius:999px}
</style></head><body>
<div class="slide" data-slide>
  <svg class="bolt" viewBox="0 0 100 200"><path d="M62 0 18 108h30L34 200 88 78H56z" fill="#fb923c"/></svg>
  <div class="kicker">__KICKER__</div>
  <h1>__TITLE__</h1>
  <div class="swipe">arrasta →</div>
  <div class="foot"><span>@stormstudio</span><span class="idx">__IDX__</span></div>
</div>
</body></html>
