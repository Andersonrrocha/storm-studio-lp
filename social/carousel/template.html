<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  /* Tokens = styles.css da landing (stormstudio.dev). Não inventar cor aqui. */
  :root{
    --bg:#05060a; --surface:#0d1019; --text:#e8eaf2; --dim:#9aa0b4; --faint:#868ea3;
    --cobre:#fb923c; --cobre-deep:#b45309; --flash:#fff4e6;
    --line:rgba(140,160,220,.12); --line-strong:rgba(140,160,220,.22);
    --grad:linear-gradient(100deg,#fff4e6 0%,#fb923c 35%,#b45309 80%);
    --fd:'Space Grotesk',system-ui,sans-serif; --fm:'JetBrains Mono',ui-monospace,monospace;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  body{background:#000;font-family:var(--fd);-webkit-font-smoothing:antialiased}
  .strip{display:flex;width:max-content}
  /* slide em 540x675 (metade de 1080x1350); export com device_scale_factor=2 */
  .slide{
    position:relative;width:540px;height:675px;overflow:hidden;flex:none;
    background:
      radial-gradient(ellipse 90% 60% at 18% 0%, rgba(180,83,9,.26), transparent 60%),
      radial-gradient(ellipse 70% 55% at 92% 100%, rgba(251,146,60,.12), transparent 60%),
      var(--bg);
    color:var(--text);padding:46px 44px 40px;display:flex;flex-direction:column;
  }
  /* linha elétrica contínua: a mesma imagem em todos os slides, deslocada — atravessa o corte */
  .slide::before{content:"";position:absolute;inset:0;background-image:var(--seam);
    background-repeat:no-repeat;background-position:var(--seam-x) 0;pointer-events:none}
  .slide::after{ /* grão */
    content:"";position:absolute;inset:0;pointer-events:none;opacity:.5;
    background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='120' height='120'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='3'/><feColorMatrix type='saturate' values='0'/></filter><rect width='120' height='120' filter='url(%23n)' opacity='.055'/></svg>");
  }
  .slide>*{position:relative;z-index:1}

  .kicker{font-family:var(--fm);font-size:12px;letter-spacing:.2em;text-transform:uppercase;color:var(--cobre);
    display:flex;align-items:center;gap:10px}
  .kicker::before{content:"";width:22px;height:1px;background:var(--cobre)}
  h1{font-size:50px;line-height:1.0;letter-spacing:-.035em;font-weight:700}
  h2{font-size:34px;line-height:1.06;letter-spacing:-.03em;font-weight:600}
  em{font-style:normal;background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
  p{font-size:18px;line-height:1.5;color:var(--dim);margin-top:16px;max-width:42ch}
  p strong{color:var(--text);font-weight:600}
  .swipe{font-family:var(--fm);font-size:12.5px;color:var(--cobre);letter-spacing:.12em;margin-top:22px}
  .foot{margin-top:auto;padding-top:16px;border-top:1px solid var(--line);
    display:flex;justify-content:space-between;align-items:center;
    font-family:var(--fm);font-size:12px;color:var(--faint);letter-spacing:.05em}
  .foot .brand{display:flex;align-items:center;gap:8px}
  .foot .brand svg{width:16px;height:16px}
  .idx{color:var(--cobre)}

  /* --- material real: molduras --- */
  .phone{width:232px;height:474px;border-radius:34px;border:5px solid #1b2030;background:#0b0d14;overflow:hidden;
    box-shadow:0 30px 60px rgba(0,0,0,.6), 0 0 0 1px rgba(140,160,220,.14), 0 0 80px rgba(251,146,60,.10)}
  .phone img{display:block;width:100%;height:100%;object-fit:cover;object-position:top}
  .browser{border-radius:10px;overflow:hidden;background:#0b0d14;border:1px solid var(--line-strong);
    box-shadow:0 26px 50px rgba(0,0,0,.55), 0 0 60px rgba(251,146,60,.08)}
  .browser .bar{height:22px;background:#12151f;display:flex;align-items:center;gap:6px;padding:0 10px;border-bottom:1px solid var(--line)}
  .browser .bar i{width:7px;height:7px;border-radius:50%;background:#2a3042;display:block}
  .browser .bar i:first-child{background:#b45309}
  .browser .bar span{margin-left:8px;font-family:var(--fm);font-size:9px;color:var(--faint);letter-spacing:.06em}
  .browser img{display:block;width:100%;object-fit:cover;object-position:top}

  /* --- tipos de slide --- */
  .cover h1{margin-top:auto;max-width:9.5ch}
  .cover .phone{position:absolute;right:-88px;top:120px;transform:rotate(-5deg);z-index:0;filter:brightness(.85)}
  .cover h1 em{background:linear-gradient(100deg,#fff4e6,#fb923c 70%);-webkit-background-clip:text;background-clip:text}
  .cover .kicker,.cover h1,.cover .swipe,.cover .foot{z-index:2}
  .cover h1{text-shadow:0 2px 24px rgba(5,6,10,.9)}

  .shot .media{margin-top:22px}
  .shot .media.phone-r{position:absolute;right:-32px;bottom:58px;transform:rotate(-4deg);z-index:0}
  .shot .browser img{height:250px}
  .shot .text{margin-top:22px}
  .shot .text.after{margin-top:auto;padding-top:22px}
  .shot .text.mid{margin-top:auto}
  .shot .text.mid + .code{margin-bottom:auto}
  .shot .media.phone-r.in{right:10px;bottom:62px;transform:rotate(-3deg)}
  .shot .text.narrow{max-width:250px}
  .shot .text.narrow p{font-size:17px}

  .code{font-family:var(--fm);font-size:15px;line-height:1.75;color:var(--dim);background:rgba(13,16,25,.85);
    border:1px solid var(--line);border-left:2px solid var(--cobre);border-radius:8px;padding:20px 22px;margin-top:22px}
  .code strong{color:var(--flash);font-weight:500}
  .code .c{color:#5c6480}

  .slide.big::before{opacity:.35}
  .numrow{display:flex;align-items:baseline;gap:14px;margin-top:auto}
  .unit{font-family:var(--fm);font-size:14px;color:var(--cobre);letter-spacing:.08em}
  .num{font-size:156px;line-height:.9;letter-spacing:-.06em;font-weight:700;
    background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
  .num-sub{font-family:var(--fm);font-size:12px;color:var(--faint);letter-spacing:.06em;margin-top:8px;line-height:1.7}
  .num-sub b{color:var(--dim);font-weight:500}

  .turn h2{font-size:42px;margin-top:auto;max-width:11ch}
  .turn .bolt{position:absolute;right:-120px;top:-40px;width:420px;z-index:0}
  .turn .bolt path{fill:#fb923c;fill-opacity:.06;stroke:#fb923c;stroke-opacity:.25;stroke-width:.8}
  .turn.flip .bolt{transform:scaleX(-1);right:auto;left:-120px}

  .quote blockquote{margin-top:auto;font-size:27px;line-height:1.22;letter-spacing:-.02em;font-weight:500;color:var(--flash);max-width:16.5ch;text-shadow:0 2px 18px rgba(5,6,10,.95)}
  .quote blockquote::before{content:"“";color:var(--cobre);font-size:60px;line-height:0;vertical-align:-22px;margin-right:4px}
  .quote .who{font-family:var(--fm);font-size:12px;color:var(--faint);letter-spacing:.06em;margin-top:22px;line-height:1.8}
  .quote .who b{color:var(--text);font-weight:500}
  .quote .phone{position:absolute;right:-72px;top:64px;transform:rotate(-7deg);z-index:0;opacity:.92}

  .list h2{margin-top:auto}
  .list ol{margin-top:18px;list-style:none;counter-reset:n}
  .list li{counter-increment:n;display:grid;grid-template-columns:34px 1fr;gap:8px;align-items:baseline;
    padding:13px 0;border-top:1px solid var(--line);font-size:20px;letter-spacing:-.01em;line-height:1.3}
  .list li::before{content:counter(n,decimal-leading-zero);font-family:var(--fm);font-size:12px;color:var(--cobre)}
  .list li b{color:var(--text);font-weight:600}
  .list li span{color:var(--dim)}

  .cta h2{margin-top:auto}
  .cta .pill{margin-top:24px;display:inline-flex;align-self:flex-start;gap:10px;align-items:center;
    background:linear-gradient(100deg,#fb923c,#b45309);color:#0b0704;font-weight:600;font-size:16px;letter-spacing:.04em;
    padding:14px 22px;border-radius:8px;font-family:var(--fm)}
  .cta .pill svg{width:16px;height:16px}
</style></head><body></body></html>
